# Mac mini へ置く repo の一覧（2026-09-29・Human Last-Mile Activation）。bootstrap.sh・doctor.sh・validate.sh・make-bundles.sh が読む。
# 形式：<name>|<source>|<test>
#   source：github＝`https://github.com/<--owner>/<name>.git` から clone（owner は引数で渡す。ここに書かない）
#           bundle＝remote の無い repo。Windows 側で make-bundles.sh が作った <name>.bundle から clone（AirDrop・USB 等で Human が運ぶ）
#   test  ：npm＝`npm test`／npm+py＝`npm test` と integrations/openmontage の unittest／none＝test しない
# 順序は MA-22 ランブック §9-2（decision-layer → en-generate-hub → crm-core → en-sns-hub）。en-product-hub は en-sns-hub の
# 「投稿済みとして記録」（sync-add）が使う。Vault は Obsidian Git の運用で別に clone する（Q2＝(i)）ので、ここには入れない。
e-nexus-decision-layer|github|npm+py
en-generate-hub|github|npm
e-nexus-crm-core|github|npm
en-sns-hub|github|npm
en-product-hub|github|npm
